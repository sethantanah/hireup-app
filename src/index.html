<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>HireUp - AI Vector Matching & Enterprise ATS Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- App Icon / Favicon -->
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS Play CDN & Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: "#e2e8f0",
            input: "#e2e8f0",
            ring: "#10b981",
            background: "#f8fafc",
            foreground: "#0f172a",
            primary: {
              DEFAULT: "#059669",
              foreground: "#ffffff",
              50: "#ecfdf5",
              100: "#d1fae5",
              500: "#10b981",
              600: "#059669",
              700: "#047857"
            },
            secondary: {
              DEFAULT: "#f1f5f9",
              foreground: "#1e293b",
            },
            destructive: {
              DEFAULT: "#ef4444",
              foreground: "#ffffff",
            },
            muted: {
              DEFAULT: "#f1f5f9",
              foreground: "#64748b",
            },
            accent: {
              DEFAULT: "#10b981",
              foreground: "#ffffff",
            },
            card: {
              DEFAULT: "#ffffff",
              foreground: "#0f172a",
            }
          },
          fontFamily: {
            display: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          },
          boxShadow: {
            'elegant': '0 1px 2px 0 rgba(15, 23, 42, 0.04), 0 12px 32px -10px rgba(15, 23, 42, 0.12)',
            'card': '0 1px 2px 0 rgba(15, 23, 42, 0.04), 0 4px 12px -2px rgba(15, 23, 42, 0.06)',
            'card-hover': '0 10px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.04)',
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <app-root></app-root>
</body>

</html>
