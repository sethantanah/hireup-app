<div class="relative w-full">
  <!-- Label -->
  <label *ngIf="label" class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
    <i *ngIf="icon" class="fa-solid {{ icon }} text-emerald-600"></i>
    <span>{{ label }}</span>
  </label>

  <!-- Trigger Button -->
  <div (click)="toggleOpen()"
       [ngClass]="{
         'min-h-[30px] px-2 py-1 text-[11px] rounded-lg': size === 'sm',
         'min-h-[42px] px-3.5 py-2 text-xs rounded-xl': size !== 'sm'
       }"
       class="w-full bg-white border border-slate-200 font-semibold text-slate-800 focus:outline-none cursor-pointer shadow-2xs flex items-center justify-between gap-1.5 transition-all hover:border-indigo-500/40 hover:shadow-xs">
    
    <!-- Display Selected Items / Placeholder -->
    <div class="flex items-center gap-1 flex-wrap flex-1 min-w-0">
      <ng-container *ngIf="selectedValues.length > 0; else placeholderTpl">
        <span *ngFor="let val of selectedValues"
              [ngClass]="size === 'sm' ? 'px-1.5 py-0.5 text-[10px]' : 'px-2.5 py-1 text-[11px]'"
              class="inline-flex items-center gap-1 bg-indigo-500/10 border border-indigo-500/20 text-indigo-700 font-bold rounded-md truncate max-w-full">
          <span class="truncate">{{ getOptionLabel(val) }}</span>
          <i *ngIf="multiple" (click)="removeValue(val, $event)" class="fa-solid fa-xmark text-[10px] hover:text-rose-600 cursor-pointer ml-0.5 transition-colors"></i>
        </span>
      </ng-container>

      <ng-template #placeholderTpl>
        <span class="text-slate-400 font-medium truncate">{{ placeholder }}</span>
      </ng-template>
    </div>

    <!-- Dropdown Chevron -->
    <i class="fa-solid fa-chevron-down text-slate-400 text-[9px] transition-transform duration-200"
       [ngClass]="{ 'transform rotate-180 text-indigo-600': isOpen }"></i>
  </div>

  <!-- Popover Menu -->
  <div *ngIf="isOpen"
       [ngStyle]="menuStyle"
       class="bg-white/98 backdrop-blur-xl border border-slate-200/90 rounded-2xl shadow-2xl overflow-hidden space-y-1 p-2 animate-in fade-in zoom-in-95">
    
    <!-- Search Input (Shown when options.length > 5) -->
    <div *ngIf="shouldShowSearch" class="p-1 mb-1">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
        <input [(ngModel)]="searchQuery"
               type="text"
               placeholder="Search..."
               class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-800 focus:bg-white focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all"
               (click)="$event.stopPropagation()" />
      </div>
    </div>

    <!-- Options List -->
    <div class="max-h-48 overflow-y-auto space-y-0.5 custom-scrollbar">
      <div *ngFor="let option of filteredOptions"
           (click)="selectOption(option); $event.stopPropagation()"
           [ngClass]="isSelected(option) ? 'bg-emerald-500/10 text-emerald-800 font-bold border border-emerald-500/20' : 'text-slate-700 hover:bg-slate-100/80 font-semibold'"
           class="px-3 py-2 rounded-xl text-xs cursor-pointer flex items-center justify-between transition-all">
        <span class="truncate">{{ getOptionLabel(option) }}</span>
        <i *ngIf="isSelected(option)" class="fa-solid fa-check text-emerald-600 text-xs"></i>
      </div>

      <div *ngIf="filteredOptions.length === 0 && !allowCustom"
           class="px-3 py-3 text-center text-xs text-slate-400 font-medium">
        No options match your search.
      </div>
    </div>

    <!-- Custom Value Entry Section (if allowCustom is true) -->
    <div *ngIf="allowCustom" class="pt-2 border-t border-slate-100 mt-1">
      <div *ngIf="!showCustomInput" (click)="showCustomInput = true; $event.stopPropagation()"
           class="px-3 py-2 bg-slate-50 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 rounded-xl text-xs font-bold cursor-pointer flex items-center gap-2 transition-colors">
        <i class="fa-solid fa-plus text-xs text-emerald-600"></i>
        <span>Add Custom Entry...</span>
      </div>

      <div *ngIf="showCustomInput" class="flex items-center gap-1.5 p-1" (click)="$event.stopPropagation()">
        <input [(ngModel)]="customInputValue"
               (keyup.enter)="addCustomEntry()"
               type="text"
               placeholder="Enter custom value..."
               class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:bg-white focus:outline-none focus:border-emerald-500" />
        <button (click)="addCustomEntry()"
                class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition-all shadow-xs">
          Add
        </button>
      </div>
    </div>
  </div>
</div>
