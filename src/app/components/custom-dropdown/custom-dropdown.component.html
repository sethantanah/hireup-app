<div class="relative w-full">
  <!-- Label -->
  <label *ngIf="label" class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
    <i *ngIf="icon" class="fa-solid {{ icon }} text-indigo-600"></i>
    <span>{{ label }}</span>
  </label>

  <!-- Trigger Button -->
  <div (click)="toggleOpen()"
       class="w-full min-h-[42px] px-3.5 py-2 bg-white rounded-xl border border-slate-200 text-xs font-semibold text-slate-800 focus:outline-none focus:border-indigo-500 cursor-pointer shadow-2xs flex items-center justify-between gap-2 flex-wrap transition-all hover:border-slate-300">
    
    <!-- Display Selected Items / Placeholder -->
    <div class="flex items-center gap-1.5 flex-wrap flex-1 min-w-0">
      <ng-container *ngIf="selectedValues.length > 0; else placeholderTpl">
        <span *ngFor="let val of selectedValues"
              class="inline-flex items-center gap-1 px-2.5 py-1 bg-indigo-50 border border-indigo-100 text-indigo-700 font-bold rounded-lg text-[11px]">
          <span>{{ val }}</span>
          <i (click)="removeValue(val, $event)" class="fa-solid fa-xmark text-[10px] hover:text-rose-600 cursor-pointer ml-0.5"></i>
        </span>
      </ng-container>

      <ng-template #placeholderTpl>
        <span class="text-slate-400 font-medium truncate">{{ placeholder }}</span>
      </ng-template>
    </div>

    <!-- Dropdown Chevron -->
    <i class="fa-solid fa-chevron-down text-slate-400 text-[10px] transition-transform duration-200"
       [ngClass]="{ 'transform rotate-180 text-indigo-600': isOpen }"></i>
  </div>

  <!-- Popover Menu -->
  <div *ngIf="isOpen"
       class="absolute left-0 right-0 top-full mt-1.5 bg-white border border-slate-200 rounded-2xl shadow-xl z-[100] overflow-hidden space-y-1 p-2 animate-in fade-in zoom-in-95">
    
    <!-- Search Input (Shown when options.length > 5) -->
    <div *ngIf="shouldShowSearch" class="p-1 mb-1">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
        <input [(ngModel)]="searchQuery"
               type="text"
               placeholder="Search..."
               class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium text-slate-800 focus:bg-white focus:outline-none focus:border-indigo-500"
               (click)="$event.stopPropagation()" />
      </div>
    </div>

    <!-- Options List -->
    <div class="max-h-48 overflow-y-auto space-y-0.5 custom-scrollbar">
      <div *ngFor="let option of filteredOptions"
           (click)="selectOption(option); $event.stopPropagation()"
           [ngClass]="isSelected(option) ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-700 hover:bg-slate-50 font-semibold'"
           class="px-3 py-2 rounded-xl text-xs cursor-pointer flex items-center justify-between transition-colors">
        <span class="truncate">{{ option }}</span>
        <i *ngIf="isSelected(option)" class="fa-solid fa-check text-indigo-600 text-xs"></i>
      </div>

      <div *ngIf="filteredOptions.length === 0 && !allowCustom"
           class="px-3 py-3 text-center text-xs text-slate-400 font-medium">
        No options match your search.
      </div>
    </div>

    <!-- Custom Value Entry Section (if allowCustom is true) -->
    <div *ngIf="allowCustom" class="pt-2 border-t border-slate-100 mt-1">
      <div *ngIf="!showCustomInput" (click)="showCustomInput = true; $event.stopPropagation()"
           class="px-3 py-2 bg-slate-50 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 rounded-xl text-xs font-bold cursor-pointer flex items-center gap-2 transition-colors">
        <i class="fa-solid fa-plus text-xs"></i>
        <span>Add Custom Entry...</span>
      </div>

      <div *ngIf="showCustomInput" class="flex items-center gap-1.5 p-1" (click)="$event.stopPropagation()">
        <input [(ngModel)]="customInputValue"
               (keyup.enter)="addCustomEntry()"
               type="text"
               placeholder="Enter custom value..."
               class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:bg-white focus:outline-none focus:border-indigo-500" />
        <button (click)="addCustomEntry()"
                class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition-all">
          Add
        </button>
      </div>
    </div>
  </div>
</div>
