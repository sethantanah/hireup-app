<header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/95 backdrop-blur-md">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-3">
    <div class="flex items-center gap-3">
      <img src="assets/logo.png" alt="HireUp Logo" class="h-9 w-9 rounded-xl object-contain shadow-xs bg-white p-0.5 border border-slate-200/80">
      <span class="font-display text-xl font-extrabold tracking-tight text-slate-900">
        HireUp
      </span>
    </div>
    
    <nav class="hidden items-center gap-6 text-xs font-semibold text-slate-600 md:flex">
      <a *ngFor="let link of navLinks" [href]="link.url"
        class="text-slate-600 hover:text-slate-900 font-bold transition-colors">
        {{ link.text }}
      </a>
    </nav>
    
    <div class="hidden md:flex items-center gap-2">
      <a routerLink="/candidate-portal" class="px-3.5 py-2 text-xs font-bold text-slate-700 hover:text-slate-900 hover:bg-slate-100/80 rounded-xl transition-all">
        Candidate Portal
      </a>
      <a routerLink="/auth/recruiter/login" class="px-3.5 py-2 text-xs font-bold text-slate-700 hover:text-slate-900 hover:bg-slate-100/80 rounded-xl transition-all">
        Sign In
      </a>
      <a routerLink="/auth/recruiter/register" class="px-4 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-xs transition-all">
        Get Started
      </a>
    </div>

    <button class="md:hidden p-2 text-slate-700 hover:text-slate-900">
      <i class="fa-solid fa-bars h-5 w-5"></i>
    </button>
  </div>
</header>
