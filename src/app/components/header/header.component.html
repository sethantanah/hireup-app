<header class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-40 shadow-xs">
  <div class="container mx-auto px-6 py-3.5 flex justify-between items-center">
    <div class="flex items-center space-x-3 cursor-pointer">
      <img [src]="logoUrl" alt="Company Logo" class="h-9 w-auto object-contain">
    </div>
    <nav class="flex items-center space-x-1.5 sm:space-x-4">
      <a *ngFor="let link of navLinks" [href]="link.url"
        class="px-3.5 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:text-indigo-600 hover:bg-indigo-50/70 transition-all duration-200">
        {{ link.text }}
      </a>
    </nav>
  </div>
</header>
