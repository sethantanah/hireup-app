<app-loader *ngIf="loading" [loadingText]="'Loading Application Form...'"></app-loader>

<app-templates-manager
  *ngIf="applicationData && formType"
  [templateId]="templateId"
  [jobAppData]="applicationData"
  [mode]="mode"
  [formOnly]="formOnly"
  [jobPostId]="jobPostId"
  [formType]="formType"
  
></app-templates-manager>
