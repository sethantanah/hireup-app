<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    
    <!-- Header -->
    <div class="text-center">
      <div class="flex justify-center mb-6">
        <div class="w-16 h-16 bg-gray-900 rounded-lg flex items-center justify-center">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
      </div>
      <h2 class="text-3xl font-bold text-gray-900">Submit Endorsement</h2>
      <p class="mt-2 text-gray-600">Upload your endorsement document</p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" 
         class="bg-red-50 border border-red-200 rounded-lg p-4">
      <div class="flex">
        <svg class="h-5 w-5 text-red-400 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
        <p class="ml-3 text-sm text-red-800">{{ errorMessage }}</p>
      </div>
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage && !endorsementForm.get('file')?.value" 
         class="bg-white rounded-lg shadow-sm border border-gray-200 p-8 text-center">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h3 class="text-xl font-semibold text-gray-900 mb-2">Thank You</h3>
      <p class="text-gray-600 mb-6">Your endorsement has been submitted successfully.</p>
      
      <!-- <div class="bg-gray-50 rounded-lg p-4 mb-6">
        <p class="text-sm text-gray-500 mb-2">Reference Information</p>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <p class="text-xs text-gray-500">Job ID</p>
            <p class="text-sm font-medium text-gray-900">{{ jobId }}</p>
          </div>
          <div>
            <p class="text-xs text-gray-500">Application ID</p>
            <p class="text-sm font-medium text-gray-900">{{ applicationId }}</p>
          </div>
        </div>
      </div> -->
      
      <button 
        type="button" 
        class="w-full bg-gray-900 text-white py-3 px-4 rounded-md font-medium hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 transition-colors"
        (click)="endorsementForm.reset(); successMessage = ''">
        Submit Another Endorsement
      </button>
    </div>

    <!-- Form -->
    <form *ngIf="!successMessage || endorsementForm.get('file')?.value"
          [formGroup]="endorsementForm" 
          (ngSubmit)="onSubmit()" 
          class="bg-white rounded-lg shadow-sm border border-gray-200 p-8 space-y-6">
      
      <!-- File Upload -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-3">
          Endorsement Document *
        </label>
        
        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-gray-400 transition-colors">
          <input 
            #fileInput
            type="file" 
            id="endorsementFile" 
            (change)="onFileSelected($event)" 
            accept=".pdf,.doc,.docx,.txt"
            class="hidden"
          />
          
          <svg class="mx-auto h-12 w-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
          </svg>
          
          <button 
            type="button"
            (click)="fileInput.click()"
            class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500"
          >
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            Choose File
          </button>
          
          <p class="mt-4 text-sm text-gray-500">
            {{ fileName || 'No file chosen' }}
          </p>
          
          <div *ngIf="endorsementForm.get('file')?.value" class="mt-4">
            <button 
              type="button"
              (click)="clearFile()"
              class="text-sm text-gray-500 hover:text-gray-700 flex items-center justify-center mx-auto"
            >
              <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              Remove file
            </button>
          </div>
          
          <div *ngIf="endorsementForm.get('file')?.touched && endorsementForm.get('file')?.errors?.['required']" 
               class="mt-4">
            <p class="text-sm text-red-600">Please select a file</p>
          </div>
          
          <p class="mt-4 text-xs text-gray-500">
            Supported formats: PDF, DOC, DOCX, TXT
          </p>
        </div>
      </div>

      <!-- Reference Information -->
      <!-- <div class="space-y-4">
        <div class="flex items-center space-x-3">
          <div class="flex-shrink-0">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
          </div>
          <div class="flex-1">
            <p class="text-sm text-gray-500">Job ID</p>
            <p class="font-medium text-gray-900">{{ jobId }}</p>
          </div>
        </div>
        
        <div class="flex items-center space-x-3">
          <div class="flex-shrink-0">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
          <div class="flex-1">
            <p class="text-sm text-gray-500">Application ID</p>
            <p class="font-medium text-gray-900">{{ applicationId }}</p>
          </div>
        </div>
      </div> -->

      <!-- Submit Button -->
      <div>
        <button 
          type="submit" 
          [disabled]="endorsementForm.invalid || isLoading"
          class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-gray-900 hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ isLoading ? 'Submitting...' : 'Submit Endorsement' }}
        </button>

        <p class="mt-4 text-sm text-gray-500">Facing any issues contact mentorship&#64;hsecampaignghana.com</p>
      </div>

    </form>

  </div>
</div>
