<!-- Loading Indicator -->
<div *ngIf="loading" class="loading-indicator">
  <i class="fas fa-spinner fa-spin"></i> {{ loadingText }}
</div>

<div class=" h-screen">
  <div class="mx-auto px-4 py-6 pt-4">
    <!-- Header -->
    <!-- <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Settings</h1>
      <p class="mt-2 text-gray-600">
        Manage your application preferences and configurations
      </p>
    </div> -->

    <!-- Settings Layout -->
    <div class="grid grid-cols-12 gap-6" *ngIf="applicationData">
      <!-- Sidebar -->
      <div class="col-span-12 md:col-span-3">
        <div class="bg-white/90 backdrop-blur-xl rounded-2xl border border-slate-200/80 shadow-xs p-3">
          <nav class="space-y-1">
            <button
              *ngFor="let item of settingsMenu"
              (click)="selectSetting(item.id)"
              [class.bg-indigo-50]="currentSetting === item.id"
              [class.text-indigo-600]="currentSetting === item.id"
              [class.font-bold]="currentSetting === item.id"
              [class.border-l-4]="currentSetting === item.id"
              [class.border-indigo-600]="currentSetting === item.id"
              class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-50 text-xs font-semibold text-slate-700 transition-all duration-200"
            >
              <i [class]="item.icon" [class.text-indigo-600]="currentSetting === item.id" class="text-slate-400 text-sm"></i>
              <span>{{ item.label }}</span>
            </button>
          </nav>
        </div>
      </div>

      <!-- Content Area -->
      <div class="col-span-12 md:col-span-9" *ngIf="applicationData">
        <div [ngSwitch]="currentSetting">
          <app-card-display-settings
            *ngSwitchCase="'card-display'"
            [applicationData]="applicationData"
            (saveChanges)="saveChanges($event)"
          ></app-card-display-settings>

          <app-search-filter-settings
            *ngSwitchCase="'search-filter'"
            [applicationData]="applicationData"
            (saveChanges)="saveChanges($event)"
          ></app-search-filter-settings>

          <div
            *ngSwitchCase="'candidate-ranking'"
            class="bg-white/90 backdrop-blur-xl rounded-2xl border border-slate-200/80 shadow-xs p-6"
          >
            <app-candidate-ranking-settings
              (saveChanges)="saveChanges($event)"
              [applicationData]="applicationData"
            ></app-candidate-ranking-settings>
          </div>

          <div *ngSwitchCase="'smtp-settings'">
            <app-smtp-settings></app-smtp-settings>
          </div>

          <div
            *ngSwitchCase="'notifications'"
            class="bg-white/90 backdrop-blur-xl rounded-2xl border border-slate-200/80 shadow-xs p-6"
          >
            <h2 class="text-lg font-bold text-slate-800">Notification Settings</h2>
            <p class="text-xs font-medium text-slate-500 mt-1">
              Configure your notification preferences
            </p>
          </div>

          <div
            *ngSwitchCase="'preferences'"
            class="bg-white/90 backdrop-blur-xl rounded-2xl border border-slate-200/80 shadow-xs p-6"
          >
            <h2 class="text-lg font-bold text-slate-800">User Preferences</h2>
            <p class="text-xs font-medium text-slate-500 mt-1">
              Customize your application experience
            </p>
          </div>

          <div
            *ngSwitchCase="'integrations'"
            class="bg-white/90 backdrop-blur-xl rounded-2xl border border-slate-200/80 shadow-xs p-6"
          >
            <h2 class="text-lg font-bold text-slate-800">Integration Settings</h2>
            <p class="text-xs font-medium text-slate-500 mt-1">
              Manage your third-party integrations
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
