<div class="flex flex-col h-full space-y-6">
  <!-- Header with Vantage Action Button -->
  <div class="bg-white/90 backdrop-blur-xl rounded-2xl border border-slate-200/80 p-6 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h2 class="text-xl font-extrabold text-slate-800 tracking-tight flex items-center gap-2">
        <i class="fas fa-filter text-indigo-600"></i>
        <span>Search & Filter Settings</span>
      </h2>
      <p class="text-xs font-medium text-slate-500 mt-1">Choose which candidate fields will be included in search and filtering options</p>
    </div>
    <button
      (click)="saveSettings()"
      class="px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white rounded-xl font-bold text-xs transition-all duration-200 flex items-center justify-center gap-2 shadow-xs hover:shadow-md transform hover:-translate-y-0.5"
    >
      <i class="fas fa-save text-xs"></i>
      <span>Save Filter Settings</span>
    </button>
  </div>

  <!-- Settings Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 overflow-y-auto max-h-[60vh] pr-1">
    <div *ngFor="let section of sections" class="bg-white/90 backdrop-blur-sm border border-slate-200/80 rounded-2xl p-5 shadow-xs hover:border-slate-300 transition-all">
      <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 pb-2 border-b border-slate-100 flex items-center justify-between">
        <span>{{ section }}</span>
        <i class="fas fa-sliders-h text-slate-400"></i>
      </h3>
      
      <div class="space-y-2">
        <div *ngFor="let field of fieldSettings | filterBySection:section" 
             class="flex items-center justify-between p-2.5 hover:bg-slate-50 rounded-xl transition-colors border border-transparent hover:border-slate-200/60">
          <label class="flex items-center space-x-3 flex-1 cursor-pointer">
            <input
              type="checkbox"
              [(ngModel)]="field.visible"
              class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 transition-colors"
            />
            <span class="text-xs font-bold text-slate-800">{{ field.label }}</span>
          </label>
          
          <span class="px-2 py-0.5 bg-slate-100 text-slate-500 rounded-md text-[11px] font-semibold">{{ field.type }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Sticky Vantage Bar -->
  <div class="sticky bottom-0 bg-white/90 backdrop-blur-xl rounded-2xl border border-slate-200/80 p-4 shadow-md flex items-center justify-between">
    <span class="text-xs font-semibold text-slate-500">Configure candidate search and dynamic filter fields</span>
    <button
      (click)="saveSettings()"
      class="px-6 py-2.5 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white rounded-xl font-bold text-xs transition-all duration-200 flex items-center gap-2 shadow-xs hover:shadow-md"
    >
      <i class="fas fa-save text-xs"></i>
      <span>Save Filter Settings</span>
    </button>
  </div>
</div>
