<div class="w-full">
  <form [formGroup]="requirementsForm" (ngSubmit)="onSubmit()" class="w-full space-y-6">
    <!-- Header with Vantage Action Button -->
    <div class="bg-white/90 backdrop-blur-xl rounded-2xl border border-slate-200/80 p-6 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h2 class="text-xl font-extrabold text-slate-800 tracking-tight flex items-center gap-2">
          <i class="fas fa-sliders-h text-indigo-600"></i>
          <span>{{ title }}</span>
        </h2>
        <p class="text-xs font-medium text-slate-500 mt-1">
          {{ subtitle }}
        </p>
      </div>
      <button
        type="submit"
        class="inline-flex items-center justify-center gap-2 px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white rounded-xl font-bold text-xs transition-all duration-200 shadow-xs hover:shadow-md transform hover:-translate-y-0.5"
      >
        <i class="fas fa-check-circle text-xs"></i>
        <span>Save Requirements</span>
      </button>
    </div>

    <!-- Scrollable Requirements List -->
    <div formArrayName="requirements" class="max-h-[60vh] overflow-y-auto pr-1 space-y-6">
      <div *ngIf="requirements.length === 0" class="p-8 text-center bg-slate-50/80 rounded-2xl border border-dashed border-slate-200">
        <p class="text-xs font-semibold text-slate-500">No evaluation criteria added yet. Click "Add Evaluation" below to create rules.</p>
      </div>

      <div *ngFor="let requirement of requirements.controls; let i=index" [formGroupName]="i"
        class="bg-white/90 backdrop-blur-sm rounded-2xl p-6 border border-slate-200/80 shadow-xs space-y-5">
        
        <div class="flex justify-between items-center pb-4 border-b border-slate-100">
          <span class="px-3 py-1 bg-indigo-50 border border-indigo-100 text-indigo-700 rounded-full text-xs font-extrabold">
            Evaluation Rule #{{i + 1}}
          </span>
          <button type="button" (click)="removeRequirement(i)"
            class="text-xs font-bold text-rose-600 hover:text-rose-800 hover:bg-rose-50 px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5">
            <i class="fas fa-trash-alt text-[11px]"></i>
            <span>Remove Rule</span>
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Document Type</label>
            <select formControlName="document_type" 
                    (change)="onDocumentTypeChange($event, i)"
                    class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200/80 rounded-xl text-xs font-medium text-slate-800 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all">
              <option value="">Select Document Type</option>
              <option *ngFor="let type of documentTypes" [value]="type">{{type}}</option>
            </select>
          </div>

          <div class="md:col-span-2">
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Criteria Prompt</label>
            <textarea formControlName="criteria" rows="3"
              placeholder="Define criteria instructions for candidate ranking evaluation..."
              class="w-full px-4 py-2.5 bg-slate-50/80 border border-slate-200/80 rounded-xl text-xs font-medium text-slate-800 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all resize-y"></textarea>
          </div>

          <div class="md:col-span-2">
            <div class="flex justify-between items-center mb-3">
              <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Evaluation Metrics</label>
              <button type="button" (click)="addEvaluationMetric(i)"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition-all">
                <i class="fas fa-plus text-[10px]"></i>
                <span>Add Metric</span>
              </button>
            </div>

            <div formArrayName="evaluation_metrics" class="space-y-2.5">
              <div *ngFor="let metric of getEvaluationMetrics(i).controls; let j=index" [formGroupName]="j"
                class="flex gap-3 items-center bg-slate-50/80 p-3 rounded-xl border border-slate-200/60">
                <input formControlName="score" placeholder="Metric Name (e.g., Technical Depth)" type="text"
                  class="flex-1 px-3 py-2 bg-white border border-slate-200/80 rounded-lg text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-indigo-500/20 outline-none">
                <div class="flex items-center gap-2">
                  <input formControlName="weight" type="number" min="0" max="100"
                    class="w-20 px-3 py-2 bg-white border border-slate-200/80 rounded-lg text-xs font-bold text-slate-800 text-right focus:ring-2 focus:ring-indigo-500/20 outline-none">
                  <span class="text-xs font-bold text-slate-500">%</span>
                  <button type="button" (click)="removeEvaluationMetric(i, j)"
                    class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all">
                    <i class="fas fa-times text-xs"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Actions -->
    <div class="sticky bottom-0 bg-white/90 backdrop-blur-xl rounded-2xl border border-slate-200/80 p-4 shadow-md flex items-center justify-between gap-4">
      <button type="button" (click)="addRequirement()"
        class="inline-flex items-center gap-2 px-5 py-2.5 border border-slate-200/80 text-slate-700 bg-white hover:bg-slate-50 rounded-xl text-xs font-bold transition-all shadow-xs">
        <i class="fas fa-plus text-xs"></i>
        <span>Add Evaluation</span>
      </button>
      <button type="submit"
        class="inline-flex items-center gap-2 px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white rounded-xl text-xs font-bold transition-all shadow-xs hover:shadow-md">
        <i class="fas fa-check-circle text-xs"></i>
        <span>Save Requirements</span>
      </button>
    </div>
  </form>
</div>
