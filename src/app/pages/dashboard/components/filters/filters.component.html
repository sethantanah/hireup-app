<div class="filters">
  <!-- Horizontal Display -->
  <div class="hidden lg:flex flex-col gap-4 rounded-xl pb-6" *ngIf="!popupView">
    <!-- Initial visible filters -->
    <div class="bg-white/90 backdrop-blur-xl p-4 rounded-2xl border border-slate-200/80 shadow-xs">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Dynamic Filter Fields -->
        <div 
          *ngFor="let field of visibleFields"
          class="flex flex-col space-y-1.5 transition-all duration-300 ease-out focus-within:col-span-1 md:focus-within:col-span-2 lg:focus-within:col-span-2 focus-within:z-20"
        >
          <label 
            [for]="'horizontal-' + field" 
            class="text-xs font-bold text-slate-600 capitalize tracking-wide"
          >
            {{ formatName(field) }}
          </label>
          <div class="relative">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input 
              [id]="'horizontal-' + field"
              type="text"
              [placeholder]="'Search ' + formatName(field).toLowerCase()"
              [(ngModel)]="filters[field]"
              (input)="onFilterChange()"
              class="w-full pl-9 pr-8 py-2 bg-slate-50/80 border border-slate-200/80 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-xs font-medium text-slate-800 transition-all duration-200"
            />
            <button 
              *ngIf="filters[field]"
              (click)="clearFilter(field)"
              class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1 transition-colors"
            >
              <i class="fas fa-times-circle text-xs"></i>
            </button>
          </div>
        </div>
    
        <!-- More Filters Button -->
        <div 
          *ngIf="hasMoreFilters" 
          class="flex items-end"
        >
          <button 
            (click)="showPopup = true"
            class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-indigo-50/80 hover:bg-indigo-100/80 text-indigo-700 border border-indigo-200/80 rounded-xl transition-all duration-200 w-full text-xs font-bold shadow-xs"
          >
            <i class="fas fa-filter text-xs"></i>
            <span>More Filters</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Popup Modal -->
    <div
      *ngIf="showPopup"
      class="fixed inset-0 bg-slate-950/40 backdrop-blur-md flex items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white/95 backdrop-blur-xl rounded-3xl p-6 max-w-3xl w-full max-h-[80vh] overflow-y-auto border border-slate-200/80 shadow-[0_0_60px_rgba(255,255,255,0.85)] shadow-white/80"
      >
        <div class="flex justify-between items-center mb-6 pb-3 border-b border-slate-100">
          <h2 class="text-lg font-black text-slate-900 tracking-tight">Additional Filters</h2>
          <button
            (click)="showPopup = false"
            class="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
          <div *ngFor="let field of hiddenFields" class="flex flex-col">
            <label
              [for]="'popup-' + field"
              class="text-xs font-bold text-slate-600 mb-1.5 capitalize"
            >
              {{ formatName(field) }}
            </label>
            <div class="relative">
              <input
                [id]="'popup-' + field"
                type="text"
                [placeholder]="
                  'Search ' + formatName(field).toLocaleLowerCase()
                "
                [(ngModel)]="filters[field]"
                (input)="onFilterChange()"
                class="w-full px-3.5 py-2 bg-slate-50/80 border border-slate-200/80 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-xs font-medium outline-none transition-all placeholder-slate-400"
              />
              <div
                *ngIf="filters[field]"
                class="absolute right-2 top-1/2 -translate-y-1/2"
              >
                <button
                  (click)="clearFilter(field)"
                  class="text-slate-400 hover:text-slate-600 p-1"
                >
                  <i class="fas fa-times-circle text-xs"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-6 flex justify-end pt-3 border-t border-slate-100">
          <button
            (click)="showPopup = false"
            class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-md shadow-indigo-500/20 transition-all"
          >
            Done
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Filter Trigger Button (popupView) -->
  <div class="flex flex-col" *ngIf="popupView">
    <div (click)="toggleAdvancedFilters()"
      class="flex items-center gap-2 px-4 py-2.5 bg-gradient-to-r from-indigo-50/90 to-blue-50/90 hover:from-indigo-100 hover:to-blue-100 border border-indigo-200/80 rounded-xl cursor-pointer shadow-xs transition-all duration-200 group"
    >
      <div class="w-6 h-6 rounded-lg bg-indigo-600/10 flex items-center justify-center text-indigo-600 group-hover:scale-110 transition-transform">
        <i class="fas fa-sliders text-xs"></i>
      </div>
      <span class="font-bold text-xs text-indigo-950">Form Field Filters</span>
      <span *ngIf="getActiveFilterCount() > 0" class="px-2 py-0.5 text-[10px] font-extrabold bg-indigo-600 text-white rounded-full shadow-xs">
        {{ getActiveFilterCount() }}
      </span>
      <i class="fas fa-chevron-down text-xs text-indigo-400 ml-auto group-hover:translate-y-0.5 transition-transform"></i>
    </div>
  </div>

  <!-- Popover Display -->
  <div
    *ngIf="dataService.showFilters"
    class="fixed inset-0 bg-slate-950/40 backdrop-blur-md flex items-center justify-center z-50 p-4"
    (click)="closeOnBackgroundClick($event)"
  >
    <div
      class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-[0_0_60px_rgba(255,255,255,0.85)] shadow-white/80 w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden border border-slate-200/80"
    >
      <div class="flex items-center justify-between p-6 border-b border-slate-100 bg-slate-50/50">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-2xl bg-indigo-600/10 flex items-center justify-center text-indigo-600">
            <i class="fas fa-sliders text-sm"></i>
          </div>
          <div>
            <h3 class="text-base font-black text-slate-900 tracking-tight">Form Field Filters</h3>
            <p class="text-xs text-slate-500 font-medium">Filter candidates by custom form fields</p>
          </div>
        </div>
        <button
          (click)="toggleAdvancedFilters()"
          class="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors"
        >
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="p-6 overflow-y-auto flex-1 space-y-6">
        <!-- Advanced Rule Filters Panel -->
        <div class="p-4 bg-slate-50/80 border border-slate-200/80 rounded-2xl">
          <div class="flex items-center justify-between mb-3">
            <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Advanced Filter Rules</h4>
            <button *ngIf="ruleFilters.length > 0" (click)="clearAllRules()" class="text-[11px] font-bold text-rose-600 hover:text-rose-700 transition-colors">
              <i class="fas fa-times mr-1"></i>Clear Rules
            </button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 items-center">
            <div>
              <app-custom-dropdown
                [options]="fieldOptions"
                labelKey="label"
                valueKey="value"
                [(value)]="newRule.field"
                placeholder="Select field..."
              ></app-custom-dropdown>
            </div>
            <div>
              <app-custom-dropdown
                [options]="operatorOptions"
                labelKey="label"
                valueKey="value"
                [(value)]="newRule.operator"
                placeholder="Operator..."
              ></app-custom-dropdown>
            </div>
            <div>
              <input
                type="text"
                [(ngModel)]="newRule.value"
                (keyup.enter)="addRule()"
                placeholder="Filter value..."
                class="w-full px-3 py-2 bg-white border border-slate-200/80 rounded-xl text-xs font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
              />
            </div>
            <div>
              <button
                (click)="addRule()"
                class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-xs transition-all flex items-center justify-center gap-1.5"
              >
                <i class="fas fa-plus text-xs"></i>
                <span>Add Filter</span>
              </button>
            </div>
          </div>

          <!-- Active Filter Rules Chips -->
          <div *ngIf="ruleFilters.length > 0" class="mt-3 flex flex-wrap gap-2 pt-3 border-t border-slate-200/60">
            <div
              *ngFor="let rule of ruleFilters; let i = index"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border border-indigo-200 rounded-xl text-xs font-semibold text-slate-700 shadow-2xs"
            >
              <span class="text-indigo-600 font-bold">{{ formatName(rule.field) }}</span>
              <span class="text-slate-400 font-normal">{{ rule.operator }}</span>
              <span class="text-slate-900 font-bold">"{{ rule.value }}"</span>
              <button (click)="removeRule(i)" class="text-slate-400 hover:text-rose-600 ml-1">
                <i class="fas fa-times text-xs"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Per-field Text Search -->
        <div>
          <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-3">Field Text Search</h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <div *ngFor="let field of filterFields" class="flex flex-col space-y-1.5">
              <label
                [for]="'popover-' + field"
                class="text-xs font-bold text-slate-600 capitalize tracking-wide"
              >
                {{ formatName(field) }}
              </label>
              <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input
                  [id]="'popover-' + field"
                  type="text"
                  [placeholder]="'Search ' + formatName(field).toLowerCase()"
                  [(ngModel)]="filters[field]"
                  (input)="onFilterChange()"
                  class="w-full pl-9 pr-8 py-2 bg-slate-50/80 border border-slate-200/80 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-xs font-medium text-slate-800 transition-all outline-none"
                />
                <div
                  *ngIf="filters[field]"
                  class="absolute right-2.5 top-1/2 -translate-y-1/2"
                >
                  <button
                    (click)="clearFilter(field)"
                    class="text-slate-400 hover:text-slate-600 p-1 transition-colors"
                  >
                    <i class="fas fa-times-circle text-xs"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="p-4 border-t border-slate-100 bg-slate-50/50 flex justify-between items-center">
        <button
          (click)="resetFilters()"
          class="px-4 py-2 text-xs font-bold text-slate-500 hover:text-rose-600 transition-colors"
        >
          Reset All Filters
        </button>
        <button
          (click)="toggleAdvancedFilters()"
          class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-md shadow-indigo-500/20 transition-all"
        >
          Apply Filters
        </button>
      </div>
    </div>
  </div>
</div>
