<div class="fixed inset-0 z-[999] flex items-center justify-center bg-white/90 backdrop-blur-sm transition-all animate-in fade-in duration-200">
  <div class="text-center p-6 max-w-md">
    <div class="inline-block animate-spin rounded-full h-16 w-16 border-4 border-emerald-600 border-t-transparent shadow-xs"></div>
    <div class="mt-6 text-xl font-semibold text-slate-800 tracking-tight">{{ loadingText || 'Loading Data' }}</div>
    <p class="text-slate-600 text-sm mt-2 max-w-md leading-relaxed" *ngIf="subText">{{ subText }}</p>
  </div>
</div>
