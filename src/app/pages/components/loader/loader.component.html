<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-md transition-all">
  <div class="bg-slate-900/90 border border-slate-800/80 p-8 rounded-3xl shadow-2xl shadow-indigo-950/50 flex flex-col items-center gap-4 max-w-xs text-center">
    <div class="relative w-14 h-14 flex items-center justify-center">
      <div class="absolute inset-0 rounded-full border-4 border-indigo-500/20"></div>
      <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-indigo-500 border-r-indigo-400 animate-spin"></div>
      <div class="w-3 h-3 bg-indigo-500 rounded-full animate-pulse shadow-sm shadow-indigo-400"></div>
    </div>
    <div>
      <h4 class="text-sm font-bold text-white tracking-tight">{{ loadingText || 'Processing...' }}</h4>
      <p class="text-[11px] text-indigo-400/80 font-medium tracking-wide mt-0.5 animate-pulse uppercase">Please wait</p>
    </div>
  </div>
</div>
