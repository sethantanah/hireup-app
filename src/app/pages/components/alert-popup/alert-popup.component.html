<div
  *ngIf="show"
  class="fixed top-6 right-6 z-50 p-4 rounded-2xl shadow-2xl backdrop-blur-xl border flex items-center min-w-[320px] max-w-md transition-all duration-300 transform translate-y-0"
  [ngClass]="type === 'success' ? 'bg-slate-900/95 text-white border-emerald-500/40 shadow-emerald-950/20' : 'bg-slate-900/95 text-white border-rose-500/40 shadow-rose-950/20'"
>
  <div class="flex items-center flex-grow gap-3">
    <div
      class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
      [ngClass]="type === 'success' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'"
    >
      <svg
        *ngIf="type === 'success'"
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
      </svg>
      <svg
        *ngIf="type === 'danger'"
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>
    <span class="text-sm font-semibold tracking-tight">{{ message }}</span>
  </div>
  <button
    (click)="close()"
    class="ml-4 p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors flex-shrink-0"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
</div>
