<div
  *ngIf="show"
  class="fixed top-5 right-5 z-50 transition-all duration-300 transform bg-white shadow-2xl rounded-2xl p-4 min-w-[360px] max-w-lg flex items-center gap-3.5 border border-slate-200/90 backdrop-blur-md"
  [ngClass]="{
    'border-l-4 border-l-emerald-500': type === 'success',
    'border-l-4 border-l-rose-500': type === 'danger' || type === 'error',
    'border-l-4 border-l-amber-500': type === 'warning',
    'border-l-4 border-l-indigo-500': type === 'info'
  }"
>
  <div class="flex-shrink-0 text-lg">
    <i class="fas" [ngClass]="{
      'fa-check-circle text-emerald-600': type === 'success',
      'fa-exclamation-circle text-rose-600': type === 'danger' || type === 'error',
      'fa-exclamation-triangle text-amber-600': type === 'warning',
      'fa-info-circle text-indigo-600': type === 'info'
    }"></i>
  </div>
  <div class="flex-grow min-w-0">
    <p class="text-xs font-bold leading-relaxed text-slate-800 break-words">{{ message }}</p>
  </div>
  <button
    (click)="close()"
    class="text-slate-400 hover:text-slate-600 text-sm p-1 rounded-lg cursor-pointer transition-colors flex-shrink-0"
  >
    <i class="fas fa-times"></i>
  </button>
</div>
